<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
  <title id="title">Containerlab MCP Server Request Flow</title>
  <desc id="desc">Animated bidirectional flow between an operator, AI client, containerlab-mcp-server, clab-api-server, and the Containerlab host.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef8f5"/>
    </linearGradient>
    <linearGradient id="mcp" x1="0" x2="1">
      <stop offset="0%" stop-color="#dcf7ed"/>
      <stop offset="100%" stop-color="#c7eee2"/>
    </linearGradient>
    <linearGradient id="api" x1="0" x2="1">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="100%" stop-color="#d9e5ff"/>
    </linearGradient>
    <linearGradient id="host" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff1dc"/>
      <stop offset="100%" stop-color="#ffe3bc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1d2939" flood-opacity="0.14"/>
    </filter>
    <style>
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .status-dot {
        animation: status-pulse 1.8s infinite;
        transform-origin: center;
      }
      @keyframes status-pulse {
        0%, 100% { opacity: .45; r: 6; }
        50% { opacity: 1; r: 8; }
      }
    </style>
  </defs>

  <rect width="1100" height="320" rx="18" fill="url(#background)"/>
  <text x="550" y="39" text-anchor="middle" class="label" font-size="22" font-weight="700" fill="#102a24">Containerlab MCP Request Flow</text>
  <text x="550" y="65" text-anchor="middle" class="label" font-size="13" fill="#496579">Natural language requests in, live lab state and operation results back</text>

  <path d="M120 158 H980" fill="none" stroke="#9fb1bf" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  <circle r="8" fill="#0b7f5f">
    <animateMotion dur="6s" repeatCount="indefinite" path="M120 158 H980 H120"/>
    <animate attributeName="fill" values="#0b7f5f;#0b7f5f;#3563c9;#d17b12;#3563c9;#0b7f5f" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".25;1;1;1;1;.25" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#shadow)">
    <rect x="35" y="116" width="170" height="84" rx="12" fill="#ffffff" stroke="#c7d3df"/>
    <rect x="250" y="116" width="170" height="84" rx="12" fill="#ffffff" stroke="#c7d3df"/>
    <rect x="465" y="116" width="170" height="84" rx="12" fill="url(#mcp)" stroke="#0b7f5f"/>
    <rect x="680" y="116" width="170" height="84" rx="12" fill="url(#api)" stroke="#3563c9"/>
    <rect x="895" y="116" width="170" height="84" rx="12" fill="url(#host)" stroke="#d17b12"/>
  </g>

  <text x="120" y="150" text-anchor="middle" class="label" font-size="15" font-weight="700" fill="#102040">Operator</text>
  <text x="120" y="172" text-anchor="middle" class="label" font-size="12" fill="#496579">describes the lab task</text>

  <text x="335" y="150" text-anchor="middle" class="label" font-size="15" font-weight="700" fill="#102040">AI Client</text>
  <text x="335" y="172" text-anchor="middle" class="label" font-size="12" fill="#496579">selects MCP tools</text>

  <text x="550" y="145" text-anchor="middle" class="label" font-size="15" font-weight="700" fill="#102a24">containerlab-mcp-server</text>
  <text x="550" y="167" text-anchor="middle" class="label" font-size="12" fill="#226a58">tools + validation</text>
  <text x="550" y="185" text-anchor="middle" class="label" font-size="11" fill="#226a58">approval-aware actions</text>

  <text x="765" y="150" text-anchor="middle" class="label" font-size="15" font-weight="700" fill="#102040">clab-api-server</text>
  <text x="765" y="172" text-anchor="middle" class="label" font-size="12" fill="#3563c9">authenticated HTTPS API</text>

  <text x="980" y="145" text-anchor="middle" class="label" font-size="15" font-weight="700" fill="#40270b">Containerlab Host</text>
  <text x="980" y="167" text-anchor="middle" class="label" font-size="12" fill="#9a5a0b">labs + nodes</text>
  <text x="980" y="185" text-anchor="middle" class="label" font-size="11" fill="#9a5a0b">Docker runtime</text>

  <g>
    <rect x="382" y="248" width="336" height="40" rx="20" fill="#ffffff" stroke="#c7d3df"/>
    <circle class="status-dot" cx="408" cy="268" r="6" fill="#0b7f5f"/>
    <text x="432" y="273" class="label" font-size="12" fill="#496579">state-changing operations require approval</text>
  </g>
</svg>
