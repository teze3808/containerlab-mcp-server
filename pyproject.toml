[project]
name = "containerlab-mcp-server"
version = "0.6.0"
description = "MCP server for the official Containerlab API Server"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.9",
]

[project.scripts]
containerlab-mcp = "containerlab_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/containerlab_mcp"]
